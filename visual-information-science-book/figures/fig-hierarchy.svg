<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="t">
  <title id="t">Two page layouts side by side: a cluttered page where everything competes, and a clear page with one dominant message and action.</title>
  <rect width="860" height="460" fill="#f7f5ef"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="42" font-size="12" letter-spacing="3" fill="#6b7074">HIERARCHY IS AN ARGUMENT ABOUT WHAT MATTERS</text>

    <text x="40" y="78" font-size="13" font-weight="bold" fill="#7d5849">A · Everything shouts</text>
    <rect x="40" y="92" width="360" height="300" rx="6" fill="#fffefb" stroke="#d9d4c7"/>

    <rect x="58" y="108" width="200" height="18" rx="3" fill="#23262a"/>
    <rect x="58" y="134" width="160" height="14" rx="3" fill="#7d5849"/>
    <rect x="270" y="108" width="112" height="18" rx="9" fill="#7d5849"/>
    <rect x="58" y="166" width="324" height="8" rx="4" fill="#b9b2a4"/>
    <rect x="58" y="182" width="300" height="8" rx="4" fill="#b9b2a4"/>
    <rect x="58" y="198" width="316" height="8" rx="4" fill="#b9b2a4"/>

    <rect x="58" y="222" width="100" height="30" rx="4" fill="#55675b"/>
    <rect x="168" y="222" width="100" height="30" rx="4" fill="#4f5f75"/>
    <rect x="278" y="222" width="100" height="30" rx="4" fill="#7d5849"/>

    <rect x="58" y="266" width="98" height="60" rx="4" fill="#e8ede7"/>
    <rect x="166" y="266" width="98" height="60" rx="4" fill="#e6eaf0"/>
    <rect x="274" y="266" width="104" height="60" rx="4" fill="#f1e7e1"/>

    <rect x="58" y="338" width="320" height="8" rx="4" fill="#b9b2a4"/>
    <rect x="58" y="354" width="260" height="8" rx="4" fill="#b9b2a4"/>

    <text x="40" y="414" font-size="10" fill="#6b7074">Six competing emphases produce no emphasis.</text>

    <line x1="430" y1="78" x2="430" y2="400" stroke="#d9d4c7"/>

    <text x="470" y="78" font-size="13" font-weight="bold" fill="#405044">B · One thing leads</text>
    <rect x="470" y="92" width="350" height="300" rx="6" fill="#fffefb" stroke="#d9d4c7"/>

    <rect x="494" y="132" width="230" height="24" rx="3" fill="#23262a"/>
    <rect x="494" y="166" width="180" height="24" rx="3" fill="#23262a" opacity="0.85"/>
    <rect x="494" y="210" width="250" height="8" rx="4" fill="#cfc9bb"/>
    <rect x="494" y="226" width="220" height="8" rx="4" fill="#cfc9bb"/>

    <rect x="494" y="262" width="128" height="36" rx="18" fill="#55675b"/>
    <text x="558" y="285" text-anchor="middle" font-size="10" letter-spacing="1" fill="#f7f5ef">GET STARTED</text>

    <rect x="494" y="330" width="180" height="8" rx="4" fill="#e7e2d6"/>
    <rect x="494" y="346" width="140" height="8" rx="4" fill="#e7e2d6"/>

    <text x="470" y="414" font-size="10" fill="#6b7074">One dominant message, one action, and air around both.</text>

    <text x="40" y="446" font-size="10.5" fill="#6b7074">Squint at a page. Whatever survives the blur is the hierarchy you actually built.</text>
  </g>
</svg>
