<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="t">
  <title id="t">Response-time thresholds: about 100 milliseconds feels instant, 400 milliseconds is the flow limit, one second keeps attention, ten seconds is the limit of patience.</title>
  <rect width="860" height="360" fill="#f7f5ef"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="42" font-size="12" letter-spacing="3" fill="#6b7074">THE PSYCHOLOGY OF A SECOND</text>

    <rect x="60" y="96" width="160" height="150" fill="#e8ede7"/>
    <rect x="220" y="96" width="170" height="150" fill="#f0ede4"/>
    <rect x="390" y="96" width="240" height="150" fill="#f1e7e1"/>
    <rect x="630" y="96" width="170" height="150" fill="#e6eaf0"/>

    <line x1="60" y1="246" x2="800" y2="246" stroke="#23262a" stroke-width="1.2"/>

    <g stroke="#23262a" stroke-width="1.2">
      <line x1="60" y1="240" x2="60" y2="252"/>
      <line x1="220" y1="240" x2="220" y2="252"/>
      <line x1="390" y1="240" x2="390" y2="252"/>
      <line x1="630" y1="240" x2="630" y2="252"/>
      <line x1="800" y1="240" x2="800" y2="252"/>
    </g>

    <g font-size="10" fill="#4c5358" text-anchor="middle">
      <text x="60" y="270">0</text>
      <text x="220" y="270">100 ms</text>
      <text x="390" y="270">400 ms</text>
      <text x="630" y="270">1 s</text>
      <text x="800" y="270">10 s</text>
    </g>

    <g font-size="10.5">
      <text x="76" y="128" font-size="9.5" letter-spacing="1.5" fill="#405044">INSTANT</text>
      <text x="76" y="150" fill="#405044">Hover, press,</text>
      <text x="76" y="166" fill="#405044">toggle.</text>
      <text x="76" y="188" fill="#6b7074">No feedback needed</text>
      <text x="76" y="204" fill="#6b7074">beyond the change.</text>

      <text x="236" y="128" font-size="9.5" letter-spacing="1.5" fill="#7d5849">FLOW</text>
      <text x="236" y="150" fill="#7d5849">Page transitions,</text>
      <text x="236" y="166" fill="#7d5849">simple searches.</text>
      <text x="236" y="188" fill="#6b7074">Above ~400 ms,</text>
      <text x="236" y="204" fill="#6b7074">show progress.</text>

      <text x="406" y="128" font-size="9.5" letter-spacing="1.5" fill="#7d5849">ATTENTION</text>
      <text x="406" y="150" fill="#7d5849">A spinner holds</text>
      <text x="406" y="166" fill="#7d5849">the thread.</text>
      <text x="406" y="188" fill="#6b7074">Past ~1 s, the mind</text>
      <text x="406" y="204" fill="#6b7074">starts to wander.</text>

      <text x="646" y="128" font-size="9.5" letter-spacing="1.5" fill="#4f5f75">PATIENCE</text>
      <text x="646" y="150" fill="#4f5f75">Long tasks need</text>
      <text x="646" y="166" fill="#4f5f75">narrative.</text>
      <text x="646" y="188" fill="#6b7074">Past ~10 s, users</text>
      <text x="646" y="204" fill="#6b7074">switch tasks.</text>
    </g>

    <g>
      <circle cx="290" cy="246" r="4" fill="#7d5849"/>
      <text x="290" y="300" text-anchor="middle" font-size="9.5" fill="#7d5849">Doherty threshold ≈ 400 ms</text>
      <line x1="290" y1="252" x2="290" y2="286" stroke="#7d5849" stroke-dasharray="3 3"/>
    </g>

    <text x="60" y="332" font-size="10" fill="#6b7074">Schematic, not to scale. The thresholds are perceptual anchors, not laws; context and expectation move them.</text>
  </g>
</svg>
