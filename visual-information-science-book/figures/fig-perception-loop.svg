<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="t">
  <title id="t">The perception loop: stimulus, sensation, perception, interpretation, action, and a new stimulus.</title>
  <rect width="860" height="420" fill="#f7f5ef"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="48" font-size="12" letter-spacing="3" fill="#6b7074">THE PERCEPTION LOOP</text>
    <text x="40" y="76" font-size="17" fill="#23262a">A page is not received. It is reconstructed, then acted upon.</text>

    <g>
      <rect x="40" y="118" width="132" height="92" rx="6" fill="#fffefb" stroke="#d9d4c7"/>
      <text x="56" y="146" font-size="10" letter-spacing="2" fill="#55675b">01</text>
      <text x="56" y="170" font-size="15" font-weight="bold" fill="#23262a">Stimulus</text>
      <text x="56" y="191" font-size="11" fill="#6b7074">photons on a screen</text>
    </g>
    <g>
      <rect x="202" y="118" width="132" height="92" rx="6" fill="#fffefb" stroke="#d9d4c7"/>
      <text x="218" y="146" font-size="10" letter-spacing="2" fill="#55675b">02</text>
      <text x="218" y="170" font-size="15" font-weight="bold" fill="#23262a">Sensation</text>
      <text x="218" y="191" font-size="11" fill="#6b7074">retina, cones, edges</text>
    </g>
    <g>
      <rect x="364" y="118" width="132" height="92" rx="6" fill="#fffefb" stroke="#d9d4c7"/>
      <text x="380" y="146" font-size="10" letter-spacing="2" fill="#55675b">03</text>
      <text x="380" y="170" font-size="15" font-weight="bold" fill="#23262a">Perception</text>
      <text x="380" y="191" font-size="11" fill="#6b7074">grouping, prediction</text>
    </g>
    <g>
      <rect x="526" y="118" width="132" height="92" rx="6" fill="#fffefb" stroke="#d9d4c7"/>
      <text x="542" y="146" font-size="10" letter-spacing="2" fill="#55675b">04</text>
      <text x="542" y="170" font-size="15" font-weight="bold" fill="#23262a">Interpretation</text>
      <text x="542" y="191" font-size="11" fill="#6b7074">meaning and trust</text>
    </g>
    <g>
      <rect x="688" y="118" width="132" height="92" rx="6" fill="#fffefb" stroke="#55675b"/>
      <text x="704" y="146" font-size="10" letter-spacing="2" fill="#55675b">05</text>
      <text x="704" y="170" font-size="15" font-weight="bold" fill="#23262a">Action</text>
      <text x="704" y="191" font-size="11" fill="#6b7074">click, scroll, leave</text>
    </g>

    <g stroke="#55675b" stroke-width="1.4" fill="none">
      <path d="M172 164 H196" marker-end="url(#arrow)"/>
      <path d="M334 164 H358" marker-end="url(#arrow)"/>
      <path d="M496 164 H520" marker-end="url(#arrow)"/>
      <path d="M658 164 H682" marker-end="url(#arrow)"/>
    </g>

    <path d="M754 214 V282 H106 V214" fill="none" stroke="#7d5849" stroke-width="1.4" stroke-dasharray="4 4"/>
    <path d="M106 220 l-5 8 m5 -8 l5 8" fill="none" stroke="#7d5849" stroke-width="1.4"/>
    <text x="430" y="305" text-anchor="middle" font-size="11" letter-spacing="1" fill="#7d5849">THE NEXT STIMULUS — every action rewrites the visual field</text>

    <g font-size="10.5" fill="#6b7074">
      <text x="40" y="368">Lossy:</text>
      <text x="40" y="386">each stage discards information and fills gaps with expectation.</text>
    </g>
    <text x="820" y="368" text-anchor="end" font-size="10.5" fill="#6b7074">Constructive:</text>
    <text x="820" y="386" text-anchor="end" font-size="10.5" fill="#6b7074">what you see is a model, not a transcript.</text>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#55675b"/>
    </marker>
  </defs>
</svg>
