<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="t">
  <title id="t">Four screens at different viewing distances: watch, phone, laptop, and television, with the note that angular size matters more than pixel count.</title>
  <rect width="860" height="400" fill="#f7f5ef"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="42" font-size="12" letter-spacing="3" fill="#6b7074">FROM WATCH TO WALL</text>

    <line x1="60" y1="286" x2="800" y2="286" stroke="#d9d4c7"/>

    <g>
      <rect x="86" y="150" width="58" height="92" rx="12" fill="#fffefb" stroke="#23262a" stroke-width="1.4"/>
      <rect x="96" y="166" width="38" height="56" rx="4" fill="#e8ede7"/>
      <rect x="112" y="136" width="6" height="14" rx="3" fill="#23262a"/>
      <text x="115" y="272" text-anchor="middle" font-size="10" fill="#4c5358">watch</text>
      <text x="115" y="316" text-anchor="middle" font-size="9.5" fill="#7d5849">~30 cm</text>
    </g>

    <g>
      <rect x="222" y="118" width="82" height="168" rx="12" fill="#fffefb" stroke="#23262a" stroke-width="1.4"/>
      <rect x="232" y="136" width="62" height="126" rx="4" fill="#e6eaf0"/>
      <circle cx="263" cy="272" r="4" fill="#d9d4c7"/>
      <text x="263" y="316" text-anchor="middle" font-size="10" fill="#4c5358">phone</text>
      <text x="263" y="334" text-anchor="middle" font-size="9.5" fill="#7d5849">~35 cm</text>
    </g>

    <g>
      <rect x="390" y="152" width="168" height="104" rx="6" fill="#fffefb" stroke="#23262a" stroke-width="1.4"/>
      <rect x="402" y="164" width="144" height="80" rx="3" fill="#f0ede4"/>
      <rect x="382" y="256" width="184" height="8" rx="3" fill="#d9d4c7"/>
      <text x="474" y="316" text-anchor="middle" font-size="10" fill="#4c5358">laptop</text>
      <text x="474" y="334" text-anchor="middle" font-size="9.5" fill="#7d5849">~60 cm</text>
    </g>

    <g>
      <rect x="640" y="124" width="152" height="92" rx="4" fill="#fffefb" stroke="#23262a" stroke-width="1.4"/>
      <rect x="650" y="134" width="132" height="72" rx="2" fill="#f1e7e1"/>
      <rect x="706" y="216" width="20" height="12" fill="#23262a"/>
      <rect x="680" y="228" width="72" height="6" rx="3" fill="#23262a"/>
      <text x="716" y="316" text-anchor="middle" font-size="10" fill="#4c5358">television</text>
      <text x="716" y="334" text-anchor="middle" font-size="9.5" fill="#7d5849">~3 m</text>
    </g>

    <path d="M115 292 V306 M263 292 V306 M474 292 V306 M716 292 V306" stroke="#7d5849" stroke-width="0.8" stroke-dasharray="2 3"/>

    <rect x="60" y="356" width="740" height="1" fill="#d9d4c7"/>
    <text x="60" y="378" font-size="10.5" fill="#4c5358">What stays constant is angular size: a 16 px label on a watch and a 48 px label on a TV can occupy the same visual angle.</text>
  </g>
</svg>
