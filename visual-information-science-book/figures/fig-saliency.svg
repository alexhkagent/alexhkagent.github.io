<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="t">
  <title id="t">A wireframe page overlaid with saliency hotspots: high-contrast headline, a face-like image, a red badge, and motion.</title>
  <rect width="860" height="460" fill="#f7f5ef"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="42" font-size="12" letter-spacing="3" fill="#6b7074">SALIENCY, IN ONE FRAME</text>

    <rect x="40" y="66" width="500" height="330" rx="8" fill="#fffefb" stroke="#d9d4c7"/>
    <rect x="40" y="66" width="500" height="34" rx="8" fill="#f0ede4"/>
    <circle cx="60" cy="83" r="4" fill="#55675b"/>
    <rect x="78" y="79" width="52" height="8" rx="4" fill="#d9d4c7"/>
    <rect x="430" y="76" width="90" height="14" rx="7" fill="#55675b"/>

    <rect x="64" y="122" width="280" height="22" rx="3" fill="#23262a"/>
    <rect x="64" y="154" width="214" height="22" rx="3" fill="#23262a" opacity="0.85"/>
    <rect x="64" y="192" width="230" height="8" rx="4" fill="#d9d4c7"/>
    <rect x="64" y="208" width="196" height="8" rx="4" fill="#d9d4c7"/>
    <rect x="64" y="238" width="108" height="30" rx="15" fill="#7d5849"/>
    <text x="118" y="258" text-anchor="middle" font-size="10" letter-spacing="1" fill="#f7f5ef">START</text>

    <rect x="376" y="118" width="136" height="150" rx="4" fill="#e6eaf0"/>
    <circle cx="444" cy="178" r="30" fill="#c9d2de"/>
    <rect x="414" y="214" width="60" height="40" rx="18" fill="#c9d2de"/>

    <rect x="64" y="290" width="136" height="82" rx="4" fill="#f0ede4"/>
    <rect x="216" y="290" width="136" height="82" rx="4" fill="#f0ede4"/>
    <rect x="368" y="290" width="144" height="82" rx="4" fill="#f0ede4"/>

    <circle cx="490" cy="83" r="26" fill="#7d5849" opacity="0.18"/>
    <circle cx="490" cy="83" r="13" fill="#7d5849" opacity="0.30"/>
    <text x="510" y="70" font-size="10" fill="#7d5849">notification</text>

    <circle cx="150" cy="136" r="46" fill="#55675b" opacity="0.10"/>
    <circle cx="150" cy="136" r="26" fill="#55675b" opacity="0.16"/>
    <circle cx="444" cy="178" r="62" fill="#4f5f75" opacity="0.10"/>
    <circle cx="444" cy="178" r="34" fill="#4f5f75" opacity="0.14"/>

    <g fill="#4c5358" font-size="10.5">
      <circle cx="594" cy="120" r="3" fill="#55675b"/>
      <text x="606" y="124">High-contrast weight</text>
      <text x="606" y="140" fill="#6b7074">pulls the eye before reading.</text>

      <circle cx="594" cy="176" r="3" fill="#4f5f75"/>
      <text x="606" y="180">Face-like structure</text>
      <text x="606" y="196" fill="#6b7074">social priority, even in a silhouette.</text>

      <circle cx="594" cy="232" r="3" fill="#7d5849"/>
      <text x="606" y="236">Isolated color</text>
      <text x="606" y="252" fill="#6b7074">novelty and threat share a channel.</text>

      <circle cx="594" cy="288" r="3" fill="#23262a"/>
      <text x="606" y="292">Motion and badges</text>
      <text x="606" y="308" fill="#6b7074">interrupt deliberate search.</text>
    </g>

    <rect x="40" y="416" width="780" height="1" fill="#d9d4c7"/>
    <text x="40" y="438" font-size="10.5" fill="#6b7074">Saliency is relative: the same button is loud on a quiet page and invisible on a busy one.</text>
  </g>
</svg>
